<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2E4057" />
  <title>Meal Planner</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <header class="mp-header">
    <div class="mp-header-row">
      <h1 id="app-name">Meal Planner</h1>
      <button id="sync-btn" class="mp-sync-btn">Connect Dropbox</button>
    </div>
    <nav class="mp-tabs">
      <button class="mp-tab active" data-view="library">Library</button>
      <button class="mp-tab" data-view="planner">Planner</button>
      <button class="mp-tab" data-view="grocery">Grocery</button>
      <button class="mp-tab" disabled title="Coming next">Tracking</button>
    </nav>
  </header>

  <main class="mp-main">
    <section id="view-library" class="mp-view">
      <section id="filters" class="mp-filters"></section>
      <div class="mp-subbar">
        <span id="count" class="mp-count"></span>
        <span id="source-tag" class="mp-source">…</span>
      </div>
      <section id="grid" class="mp-grid"></section>
    </section>

    <section id="view-planner" class="mp-view" hidden></section>

    <section id="view-grocery" class="mp-view" hidden></section>
  </main>

  <div id="toast" class="mp-toast"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
